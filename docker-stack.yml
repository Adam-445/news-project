services:
  traefik:
    image: traefik:v3.3.4
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.swarm=true"
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
      - "--providers.swarm.exposedByDefault=false"
      - "--providers.swarm.network=news-stack_backend"
      - "--entrypoints.web.address=:80"
      - "--log.level=DEBUG"
    deploy:
      placement:
        constraints: [node.role == manager]
      labels:
        - "traefik.enable=false"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend

  db:
    image: postgres:17-alpine
    deploy:
      placement:
        constraints: [node.role == manager]
    networks:
      - backend
    environment:
      POSTGRES_USER: newsuser
      POSTGRES_PASSWORD: newspass123
      POSTGRES_DB: newsdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsuser"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    deploy:
      mode: global
    networks:
      - backend
    command: redis-server --requirepass redispass123
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispass123", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: redispass123

  app:
    image: news-analyzer:local
    deploy:
      replicas: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.app.rule=PathPrefix(`/`)"
        - "traefik.http.routers.app.entrypoints=web"
        - "traefik.http.services.app.loadbalancer.server.port=8000"
        - "traefik.docker.network=news-stack_backend"
      update_config:
        parallelism: 2
        delay: 10s
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
    networks:
      - backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://newsuser:newspass123@db:5432/newsdb
      REDIS_URL: redis://:redispass123@redis:6379/0
      CELERY_BROKER_URL: redis://:redispass123@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:redispass123@redis:6379/1
      JWT_SECRET_KEY: your-secret-key-change-in-production-12345678901234567890
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
      API_KEY: your-newsapi-key-here
      REDIS_PASSWORD: redispass123
      POSTGRES_USER: newsuser
      POSTGRES_PASSWORD: newspass123
      POSTGRES_DB: newsdb
    depends_on:
      - db
      - redis

  celery:
    image: news-analyzer:local
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 1G
    command: >
      celery -A app.core.celery worker
      --loglevel=INFO
      --pool=gevent
      --concurrency=100
      -Q scraping_queue,high_priority
    networks:
      - backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://newsuser:newspass123@db:5432/newsdb
      REDIS_URL: redis://:redispass123@redis:6379/0
      CELERY_BROKER_URL: redis://:redispass123@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:redispass123@redis:6379/1
      JWT_SECRET_KEY: your-secret-key-change-in-production-12345678901234567890
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      API_KEY: your-newsapi-key-here
      REDIS_PASSWORD: redispass123

    depends_on:
      - redis

  migrations:
    image: news-analyzer:local
    deploy:
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: none
    networks:
      - backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      API_KEY: ${API_KEY}
    entrypoint: ["sh", "docker/postgres/initdb/init-db.sh"]
    depends_on:
      - db

networks:
  backend:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
